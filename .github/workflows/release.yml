name: Release app

# Tag a commit with the repo's version and push the tag:
#   git tag -a v0.16 -m "v0.16" && git push origin v0.16
# The tag must equal v + palgui __version__ + the viewer's V_0..V_3 - the
# check-version job fails the run otherwise (packaging/check_version.py).
# This builds dist/VBXE PAL Studio/ on a Windows runner and a Linux runner and
# attaches the zip and the tar.gz - plus the committed Atari viewer
# Viewer/out/view1024.xex - to a GitHub Release. Nothing runs on ordinary
# pushes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}      # allow a manual run from the Actions tab

permissions:
  contents: write            # create the Release and upload the assets

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag, GUI and viewer versions agree
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 packaging/check_version.py "${GITHUB_REF_NAME}"
          else
            python3 packaging/check_version.py
          fi

  viewer:
    # The Atari viewer is NOT assembled here (MADS + the external Libraries
    # repo aren't available); the committed Viewer/out/view1024.xex ships
    # as-is. check-version has already confirmed it carries this version.
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: view1024-xex
          path: Viewer/out/view1024.xex

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Viewer/out/view1024.xex

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        shell: pwsh
        run: ./build_app.ps1

      - name: Locate zip
        id: zip
        shell: pwsh
        run: |
          $z = Get-ChildItem -Path . -Filter 'VBXE PAL Studio v*.zip' | Select-Object -First 1
          if (-not $z) { throw 'no zip produced' }
          "path=$($z.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: VBXE-PAL-Studio-windows
          path: ${{ steps.zip.outputs.path }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
          generate_release_notes: true

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt runtime libs (for the smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3

      - name: Build
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Smoke test
        run: |
          set -euo pipefail
          APP="dist/VBXE PAL Studio"
          "$APP/palettize4" --help
          # Build a tiny source image with the build venv (it has Pillow; the
          # runner's bare Python does not).
          .venv-build/bin/python -c "from PIL import Image; Image.new('RGB',(96,72),(120,30,200)).save('/tmp/t.png')"
          "$APP/palettize4" /tmp/t.png --resize 64x48 --out /tmp/out --name t --quiet --json | tee /tmp/stats.json
          grep -q output_colours /tmp/stats.json
          test -f /tmp/out/t_stats.json
          # GUI: it must load Qt and start its event loop without crashing.
          # timeout kills the running window with rc 124; a clean self-exit is 0;
          # anything else is a real failure (missing lib, import error).
          rc=0
          timeout 20 env QT_QPA_PLATFORM=offscreen "$APP/VBXE PAL Studio" || rc=$?
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "GUI failed to start (exit $rc)" >&2
            exit 1
          fi
          echo "GUI started OK (exit $rc)"

      - name: Locate tarball
        id: tar
        run: echo "path=$(ls 'VBXE PAL Studio v'*'-linux.tar.gz' | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VBXE-PAL-Studio-linux
          path: ${{ steps.tar.outputs.path }}

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tar.outputs.path }}
